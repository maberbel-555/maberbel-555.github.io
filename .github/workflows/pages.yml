name: Build and publish academic website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
env:
  HUGO_VERSION: 0.167.0
  TZ: Europe/Madrid
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Check content
        run: python3 scripts/check_data.py
      - name: Install Hugo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/hugo"
          curl --fail --silent --show-error --location \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" \
            --output "${RUNNER_TEMP}/hugo.tar.gz"
          tar -xzf "${RUNNER_TEMP}/hugo.tar.gz" -C "${HOME}/.local/hugo"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"
      - name: Build website
        run: hugo build --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Check rendered pages
        run: python3 scripts/check_output.py public
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
          include-hidden-files: false
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
